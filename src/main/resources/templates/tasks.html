<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habitu | Kawasaki</title>

    <!-- Framework CSS Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Ícones Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Fonte Google Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --red-primary: #dc2626;
            --red-hover: #b91c1c;
            --red-light: #fef2f2;
            --text-dark: #1e293b;
            --bg-body: #f8fafc;
        }

        body {
            background-color: var(--bg-body);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }

        /* --- ANIMAÇÃO DE FUNDO (ESFERAS FLUTUANTES) --- */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }

        .bubble {
            position: absolute;
            border-radius: 50%;
            background: rgba(220, 38, 38, 0.08);
            animation: floatUp 15s infinite linear;
        }

        .bubble:nth-child(1) { width: 180px; height: 180px; left: 10%; animation-duration: 18s; }
        .bubble:nth-child(2) { width: 280px; height: 280px; left: 70%; animation-duration: 22s; animation-delay: -5s; }
        .bubble:nth-child(3) { width: 120px; height: 120px; left: 40%; animation-duration: 14s; animation-delay: -8s; }
        .bubble:nth-child(4) { width: 200px; height: 200px; left: 85%; animation-duration: 20s; animation-delay: -12s; }

        @keyframes floatUp {
            0% {
                transform: translateY(105vh) rotate(0deg);
                opacity: 0.3;
            }
            100% {
                transform: translateY(-20vh) rotate(360deg);
                opacity: 0.8;
            }
        }

        /* --- ESTRUTURA DO CARTÃO E CONTEÚDO --- */
        .main-wrapper {
            flex: 1;
        }

        .main-card {
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            background-color: #ffffff;
        }

        .app-header {
            background-color: var(--red-primary);
            color: #ffffff;
            border-radius: 15px 15px 0 0;
            padding: 1.5rem 2rem;
        }

        .badge-count {
            background-color: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .input-custom {
            border: 1px solid #cbd5e1 !important;
            border-radius: 8px 0 0 8px !important;
            padding: 0.75rem 1rem;
            color: var(--text-dark) !important;
        }

        .input-custom:focus {
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.15);
            border-color: var(--red-primary) !important;
        }

        .btn-red {
            background-color: var(--red-primary);
            border: none;
            color: #ffffff;
            font-weight: 600;
            border-radius: 0 8px 8px 0;
            padding: 0.75rem 1.5rem;
        }

        .btn-red:hover {
            background-color: var(--red-hover);
            color: #ffffff;
        }

        /* --- ESTILO ESTÁTICO DA LISTAGEM DE TAREFAS --- */
        .task-item {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-left: 4px solid var(--red-primary);
            border-radius: 8px !important;
        }

        .task-item.completed {
            border-left-color: #10b981;
            background-color: #f8fafc;
        }

        .task-title-completed {
            text-decoration: line-through;
            color: #94a3b8;
        }

        .btn-action-delete {
            color: #ef4444;
        }

        .btn-action-delete:hover {
            background-color: #fef2f2;
            color: #dc2626;
            border-radius: 6px;
        }

        /* --- FOOTER KAWASAKI --- */
        footer {
            background-color: #ffffff;
            border-top: 1px solid #e2e8f0;
            padding: 1.25rem 0;
            margin-top: 3rem;
        }

        .footer-brand {
            font-weight: 700;
            color: var(--red-primary);
        }
    </style>
</head>
<body>

<!-- Fundo Animado com Esferas CSS -->
<div class="bg-animation">
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
</div>

<div class="main-wrapper py-5">
    <div class="container" style="max-width: 650px;">

        <!-- Cartão Principal -->
        <div class="card main-card">

            <!-- Cabeçalho Vermelho -->
            <div class="app-header d-flex justify-content-between align-items-center">
                <div>
                    <div class="d-flex align-items-center gap-2 mb-1">
                        <i class="bi bi-check2-square fs-3"></i>
                        <h3 class="m-0 fw-bold">Meus Hábitos</h3>
                    </div>
                    <small class="opacity-75">Organização simples e eficiente</small>
                    <div class="mt-2" style="min-width: 220px;">
                        <div class="d-flex justify-content-between small fw-semibold">
                            <span>Nível <span th:text="${nivel}">1</span></span>
                            <span><span th:text="${xpNoNivel}">0</span> / 100 XP</span>
                        </div>
                        <div class="progress" style="height: 8px;">
                            <div class="progress-bar bg-light" role="progressbar"
                                 th:style="'width:' + ${xpNoNivel} + '%'"></div>
                        </div>
                    </div>
                </div>

                <div class="badge-count">
                    <span th:text="${#lists.size(habitos)}">0</span> Hábito(s)
                </div>
            </div>

            <div class="card-body p-4">

                <!-- Form para Adicionar Tarefa -->
                <form th:action="@{/cadastrar}" th:object="${novoHabito}" method="post" class="mb-4">
                    <div class="input-group">
                        <input type="text"
                               th:field="*{nome}"
                               class="form-control input-custom"
                               placeholder="Digite um novo hábito..."
                               required>
                        <button class="btn btn-red" type="submit">
                            <i class="bi bi-plus-lg me-1"></i> Adicionar
                        </button>
                    </div>
                </form>

                <hr class="my-4 text-muted opacity-25">

                <!-- Lista de Tarefas (Padrão Estático) -->
                <div class="d-flex flex-column gap-2">
                    <div th:each="habito : ${habitos}"
                         class="list-group-item d-flex align-items-center justify-content-between p-3 task-item">

                        <div class="d-flex align-items-center me-3">
                            <form th:action="@{/checkin/{id}(id=${habito.id})}" method="post" class="me-3 m-0">
                                <button type="submit" class="btn p-0 border-0 bg-transparent">
                                    <i th:class="${feitosHoje.contains(habito.id)} ? 'bi bi-check-circle-fill text-success fs-4' : 'bi bi-circle text-secondary fs-4'"></i>
                                </button>
                            </form>
                            <span th:text="${habito.nome}" class="fs-6 text-break fw-medium text-dark">Nome do Hábito</span>
                        </div>

                        <div class="d-flex align-items-center gap-3">
                            <small class="text-muted" th:text="${#temporals.format(habito.criadoEm, 'dd/MM/yyyy')}">01/01/2026</small>
                            <a th:href="@{/excluir/{id}(id=${habito.id})}" class="btn btn-sm btn-action-delete border-0 p-1">
                                <i class="bi bi-trash3 fs-5"></i>
                            </a>
                        </div>
                    </div>

                    <!-- Estado Vazio -->
                    <div th:if="${#lists.isEmpty(habitos)}" class="text-center py-5 text-muted">
                        <i class="bi bi-inbox display-3 d-block mb-2 text-danger opacity-50"></i>
                        <h5 class="fw-semibold text-dark">Nenhum hábito encontrado!</h5>
                        <p class="mb-0 fs-6">Adicione um hábito no campo acima para começar.</p>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<!-- Rodapé Kawasaki -->
<footer class="text-center">
    <div class="container">
        <p class="mb-0 text-slate-600 fs-6">
            Desenvolvido por <span class="footer-brand">Kauan Kawasaki</span> &copy; 2026
        </p>
        <small class="text-muted" style="font-size: 0.75rem;">
            Projeto Spring Boot, Kotlin, JPA e Thymeleaf
        </small>
    </div>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
