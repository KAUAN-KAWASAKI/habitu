spring.application.name=TodoList

# Configuração de Conexão MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/habitudb?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Forçar o Dialeto Hibernate para MySQL (evita o erro de Dialect)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Atualização automática das tabelas
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true