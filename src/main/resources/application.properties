spring.application.name=TodoList

# Configuração de Conexão MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/habitudb?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
server.port=${PORT:8080}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Forçar o Dialeto Hibernate para MySQL (evita o erro de Dialect)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Atualização automática das tabelas
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true